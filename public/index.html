<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debt Escape - Ultimate Edition</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #27ae60;
            --accent: #e74c3c;
            --light: #ecf0f1;
            --dark: #2c3e50;
            --gold: #f1c40f;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--light); color: var(--dark); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        #main-layout { display: flex; width: 100%; height: 100%; }

        /* Game Area */
        #game-area { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 20px; overflow-y: auto; align-items: center; }

        h1 { font-size: 2.5em; margin: 0; text-align: center; }

        #top-bar { display: flex; gap: 20px; width: 100%; max-width: 800px; }
        .player-card { background: white; padding: 15px; border-radius: 15px; flex: 1; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-left: 10px solid #ccc; transition: all 0.3s; }
        .player-card.active { border-color: var(--secondary); transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .player-card h3 { margin: 0 0 5px 0; }
        .player-card p { margin: 2px 0; font-weight: bold; }

        #board-circle { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin: 20px 0; }
        .tile { width: 140px; height: 140px; background: white; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border: 4px solid transparent; position: relative; }
        .tile.active { border-color: var(--secondary); transform: scale(1.1); box-shadow: 0 0 20px var(--secondary); }
        .tile-emoji { font-size: 3em; }
        .tile-name { font-weight: bold; font-size: 0.9em; }
        .token-container { position: absolute; bottom: 5px; display: flex; gap: 3px; }
        .token { width: 20px; height: 20px; border-radius: 50%; border: 2px solid white; }

        #interaction-area { background: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 5px 30px rgba(0,0,0,0.1); width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        #game-numbers { font-size: 2.5em; font-weight: bold; color: var(--accent); min-height: 1.2em; }
        #action-prompt { margin: 0; font-size: 1.2em; text-align: center; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .action-btn { font-size: 1.2em; padding: 12px 24px; border-radius: 12px; border: none; cursor: pointer; background: var(--secondary); color: white; transition: 0.2s; }
        .action-btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .item-btn { background: var(--gold); color: #333; }
        .roll-btn { background: #f39c12; font-size: 1.8em; padding: 15px 40px; }

        /* Log Area */
        #log-area { width: 350px; background: #2c3e50; color: white; display: flex; flex-direction: column; border-left: 1px solid #1a252f; }
        #log-header { padding: 20px; background: #1a252f; font-weight: bold; font-size: 1.2em; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column-reverse; gap: 10px; }
        #messages p { margin: 0; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 8px; font-size: 0.95em; }

        #setup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; }
        #setup-card { background: white; padding: 40px; border-radius: 20px; text-align: center; max-width: 400px; width: 90%; }
        #setup-card input { width: 100%; font-size: 1.2em; padding: 10px; margin: 20px 0; box-sizing: border-box; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="setup-overlay">
        <div id="setup-card">
            <h2>🏥 Debt Escape 🎰</h2>
            <p>Escape your 50,000 debt!</p>

            <div id="setup-options">
                <input type="text" id="player-names" placeholder="Names (e.g. Alice, Bob)" value="Alice, Bob">
                <button class="action-btn" onclick="createRoom()">Create New Game 🏠</button>
                <hr>
                <input type="text" id="room-id-input" placeholder="ROOM CODE (e.g. AB12CD)">
                <button class="action-btn" onclick="joinRoom()">Join Game 🤝</button>
            </div>
        </div>
    </div>

    <div id="main-layout" class="hidden">
        <div id="game-area">
            <h1>🏛️ Debt Escape 🏛️ <span id="current-room-display" style="font-size: 0.5em; color: #7f8c8d;"></span></h1>

            <div id="top-bar"></div>

            <div id="board-circle">
                <div class="tile" id="tile-0"><div class="tile-emoji">🏥</div><div class="tile-name">Rehab</div><div class="token-container"></div></div>
                <div class="tile" id="tile-1"><div class="tile-emoji">🎰</div><div class="tile-name">Casino</div><div class="token-container"></div></div>
                <div class="tile" id="tile-2"><div class="tile-emoji">🌑</div><div class="tile-name">Back Alley</div><div class="token-container"></div></div>
                <div class="tile" id="tile-3"><div class="tile-emoji">🛍️</div><div class="tile-name">Shop</div><div class="token-container"></div></div>
                <div class="tile" id="tile-4"><div class="tile-emoji">🚕</div><div class="tile-name">Taxi</div><div class="token-container"></div></div>
            </div>

            <div id="interaction-area">
                <div id="game-numbers"></div>
                <h3 id="action-prompt">Waiting...</h3>
                <div id="btn-container" class="btn-group"></div>
                <div id="manual-input" class="hidden">
                    <input type="text" id="user-input" style="font-size: 1.2em; padding: 10px; border-radius: 10px; border: 2px solid #ddd;">
                    <button class="action-btn" id="submit-btn">Send ✅</button>
                </div>
            </div>
        </div>

        <div id="log-area">
            <div id="log-header">📜 Game Log</div>
            <div id="messages"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const colors = ['#f44336', '#2196f3', '#4caf50', '#ffeb3b', '#9c27b0'];
        let currentRoomId = null;

        function createRoom() {
            const names = document.getElementById('player-names').value.split(',').map(n => n.trim());
            socket.emit('create_room', names);
        }

        function joinRoom() {
            const roomId = document.getElementById('room-id-input').value.trim();
            socket.emit('join_room', roomId);
        }

        socket.on('room_created', (roomId) => {
            currentRoomId = roomId;
            enterGame();
        });

        socket.on('joined_room', (roomId) => {
            currentRoomId = roomId;
            enterGame();
        });

        socket.on('error', (msg) => alert(msg));

        function enterGame() {
            document.getElementById('setup-overlay').classList.add('hidden');
            document.getElementById('main-layout').classList.remove('hidden');
            document.getElementById('current-room-display').textContent = `ROOM: ${currentRoomId}`;
        }

        socket.on('game_message', (msg) => {
            const messagesDiv = document.getElementById('messages');
            const p = document.createElement('p');
            p.textContent = msg;
            messagesDiv.appendChild(p);

            // Extract numbers for display
            const numMatch = msg.match(/Total: (\d+)|New total: (\d+)|rolled a (\d+)/);
            if (numMatch) {
                document.getElementById('game-numbers').textContent = numMatch[1] || numMatch[2] || numMatch[3];
            }
        });

        socket.on('game_state', (state) => {
            if (!state) return;
            const topBar = document.getElementById('top-bar');
            topBar.innerHTML = state.players.map((p, i) => `
                <div class="player-card ${i === state.currentPlayerIdx ? 'active' : ''}" style="border-left-color: ${colors[i % colors.length]}">
                    <h3>${p.name}</h3>
                    <p>💰 $${p.money}</p>
                    <p>📉 Debt: $${p.debt}</p>
                    <p>🎒 Items: ${p.inventory.length || 0}</p>
                </div>
            `).join('');

            for(let i=0; i<5; i++) {
                const tileDiv = document.getElementById(`tile-${i}`);
                if (!tileDiv) continue;
                tileDiv.classList.remove('active');
                const tokenContainer = tileDiv.querySelector('.token-container');
                tokenContainer.innerHTML = '';
                state.players.filter(p => p.position === i).forEach(p => {
                    const pIdx = state.players.findIndex(player => player.name === p.name);
                    const token = document.createElement('div');
                    token.className = 'token';
                    token.style.background = colors[pIdx % colors.length];
                    tokenContainer.appendChild(token);
                });
            }
            const activePlayerPos = state.players[state.currentPlayerIdx].position;
            document.getElementById(`tile-${activePlayerPos}`).classList.add('active');
        });

        const actionPrompt = document.getElementById('action-prompt');
        const btnContainer = document.getElementById('btn-container');

        socket.on('need_roll', ({ prompt, usableItems }) => {
            resetInteraction();
            actionPrompt.textContent = prompt;

            const rollBtn = document.createElement('button');
            rollBtn.className = 'action-btn roll-btn';
            rollBtn.textContent = 'Roll 🎲';
            rollBtn.onclick = () => { socket.emit('submit_input', { roomId: currentRoomId, val: 'roll' }); resetInteraction(); };
            btnContainer.appendChild(rollBtn);

            usableItems.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'action-btn item-btn';
                btn.textContent = `Use ${item} 🎒`;
                btn.onclick = () => { socket.emit('submit_input', { roomId: currentRoomId, val: item }); resetInteraction(); };
                btnContainer.appendChild(btn);
            });
        });

        socket.on('need_choice', ({ prompt, choices, usableItems }) => {
            resetInteraction();
            actionPrompt.textContent = prompt;
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.textContent = choice;
                btn.onclick = () => { socket.emit('submit_input', { roomId: currentRoomId, val: choice }); resetInteraction(); };
                btnContainer.appendChild(btn);
            });
            if (usableItems) {
                usableItems.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = 'action-btn item-btn';
                    btn.textContent = `Use ${item} 🎒`;
                    btn.onclick = () => { socket.emit('submit_input', { roomId: currentRoomId, val: item }); resetInteraction(); };
                    btnContainer.appendChild(btn);
                });
            }
        });

        socket.on('need_input', (prompt) => {
            resetInteraction();
            actionPrompt.textContent = prompt;
            document.getElementById('manual-input').classList.remove('hidden');
        });

        document.getElementById('submit-btn').onclick = () => {
            socket.emit('submit_input', { roomId: currentRoomId, val: document.getElementById('user-input').value });
            document.getElementById('user-input').value = '';
            resetInteraction();
        };

        function resetInteraction() {
            actionPrompt.textContent = "Processing...";
            btnContainer.innerHTML = '';
            document.getElementById('manual-input').classList.add('hidden');
        }

        socket.on('game_over', () => {
            resetInteraction();
            actionPrompt.textContent = "🎊 GAME OVER 🎊";
        });
    </script>
</body>
</html>
