<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debt Escape - Ultimate Casino Edition</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #27ae60;
            --accent: #e74c3c;
            --light: #ecf0f1;
            --dark: #2c3e50;
            --gold: #f1c40f;
            --felt: #1a5e35;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #setup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 100; }
        #setup-card { background: white; color: #333; padding: 40px; border-radius: 20px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        #setup-card input { width: 100%; font-size: 1.2em; padding: 10px; margin: 20px 0; box-sizing: border-box; border: 2px solid #ddd; border-radius: 8px; }

        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }

        /* The Board */
        #board-wrapper { position: relative; width: 850px; height: 850px; flex-shrink: 0; }
        #board { position: relative; width: 800px; height: 800px; border-radius: 50%; border: 15px solid #3d2b1f; background: rgba(255,255,255,0.05); box-shadow: 0 0 50px rgba(0,0,0,1); }

        .tile {
            position: absolute;
            width: 130px;
            height: 130px;
            background: #eee;
            color: #333;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 0 #bbb;
            transition: all 0.3s;
            z-index: 10;
            border: 2px solid #fff;
        }
        .tile.active { transform: scale(1.1); box-shadow: 0 0 30px var(--gold); border-color: var(--gold); }
        .tile-emoji { font-size: 3em; }
        .tile-name { font-weight: bold; font-size: 0.9em; }

        /* Tokens */
        .token {
            position: absolute;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 4px solid white;
            z-index: 50;
            transition: all 0.5s ease-in-out;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        /* Center Interaction Area - Blackjack Theme */
        #center-ui {
            position: absolute;
            width: 480px;
            height: 480px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: var(--felt);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8), 0 0 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 10px solid #2c1e15;
            z-index: 20;
        }

        #game-numbers { font-size: 5em; font-weight: bold; color: var(--gold); margin-bottom: 5px; text-shadow: 2px 2px 0px rgba(0,0,0,0.5); min-height: 1.2em; font-family: 'Georgia', serif; }
        #action-prompt { font-size: 1.5em; margin: 5px 0; min-height: 2.5em; display: flex; align-items: center; justify-content: center; color: white; text-shadow: 1px 1px 2px black; }

        .btn-group { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        .action-btn { font-size: 1.1em; padding: 12px 24px; border-radius: 50px; border: none; cursor: pointer; background: #c0392b; color: white; transition: 0.2s; box-shadow: 0 4px 0 #7b241c; font-weight: bold; text-transform: uppercase; }
        .action-btn:hover { transform: scale(1.05); box-shadow: 0 6px 0 #7b241c; }
        .action-btn:active { transform: translateY(2px); box-shadow: 0 0 0 #7b241c; }
        .item-btn { background: var(--gold); color: #333; box-shadow: 0 4px 0 #c29d0b; }
        .roll-btn { background: #2980b9; font-size: 1.4em; box-shadow: 0 4px 0 #1a5276; }

        /* Turn Log - Right Side */
        #turn-log-container {
            position: absolute;
            right: 40px;
            width: 320px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        #turn-log-header { font-size: 1.5em; font-weight: bold; border-bottom: 2px solid var(--gold); padding-bottom: 10px; color: var(--gold); }
        #turn-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 15px; }
        #turn-log p { margin: 0; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; font-size: 0.95em; border-left: 4px solid var(--gold); animation: slideIn 0.3s ease-out; }

        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        /* Player Stats Area - Left Side */
        #stats-container {
            position: absolute;
            left: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 300px;
            height: 80vh;
            overflow-y: auto;
        }
        .player-card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.1);
            transition: 0.3s;
        }
        .player-card.active {
            background: var(--gold);
            color: #333;
            transform: scale(1.05) translateX(10px);
            border-color: white;
            box-shadow: 0 10px 20px rgba(241, 196, 15, 0.3);
        }
        .player-card h3 { margin: 0 0 10px 0; font-size: 1.4em; }
        .player-card p { margin: 4px 0; font-size: 1.1em; font-weight: bold; }

        .hidden { display: none !important; }

        #room-info { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 1.2em; opacity: 0.7; font-weight: bold; color: var(--gold); }
    </style>
</head>
<body>
    <div id="setup-overlay">
        <div id="setup-card">
            <h2>🏛️ Debt Escape 🏛️</h2>
            <p>Ultimate Casino Edition</p>

            <div id="setup-options">
                <input type="text" id="player-names" placeholder="Your Name" value="Player">
                <input type="text" id="room-id-input" placeholder="ROOM CODE (Join existing)">
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button class="action-btn" style="flex: 1;" onclick="createRoom()">New Game</button>
                    <button class="action-btn" style="flex: 1;" onclick="joinRoom()">Join Game</button>
                </div>
            </div>
        </div>
    </div>

    <div id="game-container" class="hidden">
        <div id="stats-container"></div>

        <div id="board-wrapper">
            <div id="board">
                <div class="tile" id="tile-0"><div class="tile-emoji">🏥</div><div class="tile-name">Rehab</div></div>
                <div class="tile" id="tile-1"><div class="tile-emoji">🎰</div><div class="tile-name">Casino</div></div>
                <div class="tile" id="tile-2"><div class="tile-emoji">🌑</div><div class="tile-name">Back Alley</div></div>
                <div class="tile" id="tile-3"><div class="tile-emoji">🛍️</div><div class="tile-name">Shop</div></div>
                <div class="tile" id="tile-4"><div class="tile-emoji">🚕</div><div class="tile-name">Taxi</div></div>
            </div>

            <div id="center-ui">
                <div id="game-numbers">🎲</div>
                <div id="action-prompt">Waiting...</div>
                <div id="btn-container" class="btn-group"></div>
                <div id="manual-input" class="hidden">
                    <input type="text" id="user-input" style="width: 150px; padding: 10px; border-radius: 8px;">
                    <button class="action-btn" id="submit-btn">OK</button>
                </div>
            </div>
        </div>

        <div id="turn-log-container">
            <div id="turn-log-header">📝 TURN LOG</div>
            <div id="turn-log"></div>
        </div>

        <div id="room-info">ROOM: <span id="room-id">?</span></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6'];
        let currentRoomId = null;
        let localPlayerName = null;
        let playerTokens = {};
        let gameState = null;

        const boardSize = 800;
        const radius = 335;
        const tiles = document.querySelectorAll('.tile');
        const tileCoords = [];

        tiles.forEach((tile, i) => {
            const angle = -Math.PI/2 + (i * (2 * Math.PI / tiles.length));
            const x = (boardSize/2) + radius * Math.cos(angle) - 65;
            const y = (boardSize/2) + radius * Math.sin(angle) - 65;
            tile.style.left = `${x}px`;
            tile.style.top = `${y}px`;
            tileCoords.push({x: x + 65, y: y + 65});
        });

        function createRoom() {
            localPlayerName = document.getElementById('player-names').value.trim();
            const names = [localPlayerName];
            socket.emit('create_room', names);
        }

        function joinRoom() {
            localPlayerName = document.getElementById('player-names').value.trim();
            const roomId = document.getElementById('room-id-input').value.trim().toUpperCase();
            socket.emit('join_room', roomId);
        }

        socket.on('room_created', (roomId) => { currentRoomId = roomId; enterGame(); });
        socket.on('joined_room', (roomId) => { currentRoomId = roomId; enterGame(); });
        socket.on('error', (msg) => alert(msg));

        function enterGame() {
            document.getElementById('setup-overlay').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            document.getElementById('room-id').textContent = currentRoomId;
        }

        socket.on('game_message', (msg) => {
            if (msg.startsWith('---')) {
                document.getElementById('turn-log').innerHTML = ''; // Clear log on new turn
            }
            const log = document.getElementById('turn-log');
            const p = document.createElement('p');
            p.textContent = msg;
            log.appendChild(p);
            log.scrollTop = log.scrollHeight;

            const numMatch = msg.match(/(?:Total|New total|rolled a|Roll|Rolled|be|is):?\s*(\d+)/i);
            if (numMatch) animateNumbers(numMatch[1]);
        });

        function animateNumbers(finalVal) {
            const el = document.getElementById('game-numbers');
            let count = 0;
            const interval = setInterval(() => {
                el.textContent = Math.floor(Math.random() * 6) + 1;
                el.style.transform = `scale(${1 + Math.random() * 0.3})`;
                if (++count > 10) {
                    clearInterval(interval);
                    el.textContent = finalVal;
                    el.style.transform = 'scale(1.2)';
                    setTimeout(() => el.style.transform = 'scale(1)', 150);
                }
            }, 60);
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        socket.on('game_state', async (state) => {
            if (!state) return;
            const oldState = gameState;
            gameState = state;

            const statsContainer = document.getElementById('stats-container');
            statsContainer.innerHTML = state.players.map((p, i) => `
                <div class="player-card ${i === state.currentPlayerIdx ? 'active' : ''}">
                    <h3>${escapeHTML(p.name)}</h3>
                    <p>💰 $${p.money.toLocaleString()}</p>
                    <p>📉 Debt: $${p.debt.toLocaleString()}</p>
                    <p>🎒 Items: ${escapeHTML(p.inventory.join(', ')) || 'None'}</p>
                </div>
            `).join('');

            tiles.forEach(t => t.classList.remove('active'));
            const activePlayer = state.players[state.currentPlayerIdx];
            document.getElementById(`tile-${activePlayer.position}`).classList.add('active');

            for (let i = 0; i < state.players.length; i++) {
                const p = state.players[i];
                if (!playerTokens[p.name]) {
                    const token = document.createElement('div');
                    token.className = 'token';
                    token.style.background = colors[i % colors.length];
                    document.getElementById('board').appendChild(token);
                    playerTokens[p.name] = token;
                    updateTokenPos(p.name, p.position, i, state.players.length);
                } else {
                    const oldPos = oldState ? oldState.players[i].position : p.position;
                    if (oldPos !== p.position) {
                        await moveTokenAnimated(p.name, oldPos, p.position, i, state.players.length);
                    } else {
                        updateTokenPos(p.name, p.position, i, state.players.length);
                    }
                }
            }
        });

        function updateTokenPos(name, pos, idx, total) {
            const coords = tileCoords[pos];
            const offset = (idx - (total-1)/2) * 25;
            playerTokens[name].style.left = `${coords.x - 14 + offset}px`;
            playerTokens[name].style.top = `${coords.y - 14}px`;
        }

        async function moveTokenAnimated(name, start, end, idx, total) {
            let current = start;
            const numTiles = tiles.length;
            while (current !== end) {
                current = (current + 1) % numTiles;
                updateTokenPos(name, current, idx, total);
                await new Promise(r => setTimeout(r, 400));
            }
        }

        socket.on('need_roll', ({ prompt, usableItems, playerName }) => {
            resetInteraction();
            if (playerName && localPlayerName !== playerName) {
                document.getElementById('action-prompt').textContent = `Waiting for ${playerName}...`;
                return;
            }
            document.getElementById('action-prompt').textContent = prompt;
            const rollBtn = document.createElement('button');
            rollBtn.className = 'action-btn roll-btn';
            rollBtn.textContent = 'ROLL 🎲';
            rollBtn.onclick = () => { socket.emit('submit_input', { roomId: currentRoomId, val: 'roll' }); resetInteraction(); };
            document.getElementById('btn-container').appendChild(rollBtn);
            addItems(usableItems);
        });

        socket.on('need_choice', ({ prompt, choices, usableItems, playerName }) => {
            resetInteraction();
            if (playerName && localPlayerName !== playerName) {
                document.getElementById('action-prompt').textContent = `Waiting for ${playerName}...`;
                return;
            }
            document.getElementById('action-prompt').textContent = prompt;
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.textContent = choice;
                btn.onclick = () => { socket.emit('submit_input', { roomId: currentRoomId, val: choice }); resetInteraction(); };
                document.getElementById('btn-container').appendChild(btn);
            });
            addItems(usableItems);
        });

        function addItems(items) {
            if (!items) return;
            items.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'action-btn item-btn';
                btn.textContent = `Use ${item} 🎒`;
                btn.onclick = () => { socket.emit('submit_input', { roomId: currentRoomId, val: item }); resetInteraction(); };
                document.getElementById('btn-container').appendChild(btn);
            });
        }

        function resetInteraction() {
            document.getElementById('action-prompt').textContent = "Processing...";
            document.getElementById('btn-container').innerHTML = '';
            document.getElementById('manual-input').classList.add('hidden');
        }

        socket.on('game_over', () => {
            resetInteraction();
            document.getElementById('action-prompt').textContent = "🎊 ESCAPED DEBT! 🎊";
        });
    </script>
</body>
</html>
