<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debt Escape - Ultimate Edition</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #27ae60;
            --accent: #e74c3c;
            --light: #ecf0f1;
            --dark: #2c3e50;
            --gold: #f1c40f;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #setup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 100; }
        #setup-card { background: white; color: #333; padding: 40px; border-radius: 20px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        #setup-card input { width: 100%; font-size: 1.2em; padding: 10px; margin: 20px 0; box-sizing: border-box; border: 2px solid #ddd; border-radius: 8px; }

        #game-container { position: relative; width: 900px; height: 900px; display: flex; justify-content: center; align-items: center; }

        /* The Board */
        #board { position: relative; width: 800px; height: 800px; border-radius: 50%; border: 10px solid rgba(255,255,255,0.1); }

        .tile {
            position: absolute;
            width: 140px;
            height: 140px;
            background: white;
            color: #333;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s;
            z-index: 10;
        }
        .tile.active { transform: scale(1.1); box-shadow: 0 0 30px var(--secondary); border: 4px solid var(--secondary); }
        .tile-emoji { font-size: 3.5em; }
        .tile-name { font-weight: bold; font-size: 1em; }

        /* Tokens */
        .token {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid white;
            z-index: 50;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Center Interaction Area */
        #center-ui {
            position: absolute;
            width: 450px;
            height: 450px;
            background: rgba(44, 62, 80, 0.95);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 0 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 5px solid rgba(255,255,255,0.1);
            z-index: 20;
        }

        #game-numbers { font-size: 4em; font-weight: bold; color: var(--gold); margin-bottom: 10px; text-shadow: 0 0 20px rgba(241, 196, 15, 0.5); min-height: 1.2em; }
        #action-prompt { font-size: 1.4em; margin: 10px 0; min-height: 3em; display: flex; align-items: center; justify-content: center; }

        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-height: 150px; overflow-y: auto; }
        .action-btn { font-size: 1.1em; padding: 10px 20px; border-radius: 12px; border: none; cursor: pointer; background: var(--secondary); color: white; transition: 0.2s; box-shadow: 0 4px 0 #1e8449; }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #1e8449; }
        .action-btn:active { transform: translateY(2px); box-shadow: 0 0 0 #1e8449; }
        .item-btn { background: var(--gold); color: #333; box-shadow: 0 4px 0 #c29d0b; }
        .item-btn:hover { box-shadow: 0 6px 0 #c29d0b; }
        .roll-btn { background: #f39c12; font-size: 1.5em; padding: 15px 30px; box-shadow: 0 4px 0 #d35400; }

        /* Seamless Log */
        #messages {
            position: absolute;
            top: -220px;
            width: 400px;
            height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            padding: 10px;
            mask-image: linear-gradient(to top, black 80%, transparent 100%);
        }
        #messages p {
            margin: 0;
            padding: 8px 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            font-size: 0.9em;
            animation: fadeIn 0.3s ease-out;
            border-left: 4px solid var(--gold);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Player Stats Area */
        #stats-container {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 250px;
        }
        .player-card {
            background: rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border-left: 8px solid #555;
            transition: 0.3s;
        }
        .player-card.active { background: rgba(255,255,255,0.2); transform: translateX(10px); border-left-color: var(--secondary); }
        .player-card h3 { margin: 0 0 5px 0; font-size: 1.1em; }
        .player-card p { margin: 2px 0; font-size: 0.9em; opacity: 0.9; }

        .hidden { display: none !important; }

        #room-info { position: absolute; bottom: 20px; right: 20px; font-size: 1.2em; opacity: 0.5; }
    </style>
</head>
<body>
    <div id="setup-overlay">
        <div id="setup-card">
            <h2>🏥 Debt Escape 🎰</h2>
            <p>Can you pay back 50,000?</p>

            <div id="setup-options">
                <input type="text" id="player-names" placeholder="Names (e.g. Alice, Bob)" value="Alice, Bob">
                <button class="action-btn" onclick="createRoom()">Create New Game 🏠</button>
                <hr>
                <p>Already have a game? (Room 1)</p>
                <button class="action-btn" onclick="joinRoom('1')">Join Room 1 🤝</button>
            </div>
        </div>
    </div>

    <div id="game-container" class="hidden">
        <div id="stats-container"></div>

        <div id="board">
            <!-- Tiles will be positioned by JS -->
            <div class="tile" id="tile-0"><div class="tile-emoji">🏥</div><div class="tile-name">Rehab</div></div>
            <div class="tile" id="tile-1"><div class="tile-emoji">🎰</div><div class="tile-name">Casino</div></div>
            <div class="tile" id="tile-2"><div class="tile-emoji">🌑</div><div class="tile-name">Back Alley</div></div>
            <div class="tile" id="tile-3"><div class="tile-emoji">🛍️</div><div class="tile-name">Shop</div></div>
            <div class="tile" id="tile-4"><div class="tile-emoji">🚕</div><div class="tile-name">Taxi</div></div>
        </div>

        <div id="center-ui">
            <div id="messages"></div>
            <div id="game-numbers">🎲</div>
            <div id="action-prompt">Waiting for players...</div>
            <div id="btn-container" class="btn-group"></div>
            <div id="manual-input" class="hidden">
                <input type="text" id="user-input" style="width: 150px; padding: 8px; border-radius: 8px;">
                <button class="action-btn" id="submit-btn">OK</button>
            </div>
        </div>

        <div id="room-info">ROOM: <span id="room-id">?</span></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6'];
        let currentRoomId = null;
        let playerTokens = {};

        // Position tiles in a circle
        const boardSize = 800;
        const radius = 330;
        const tiles = document.querySelectorAll('.tile');
        const tileCoords = [];

        tiles.forEach((tile, i) => {
            const angle = -Math.PI/2 + (i * (2 * Math.PI / tiles.length));
            const x = (boardSize/2) + radius * Math.cos(angle) - 70;
            const y = (boardSize/2) + radius * Math.sin(angle) - 70;
            tile.style.left = `${x}px`;
            tile.style.top = `${y}px`;
            tileCoords.push({x: x + 70, y: y + 70}); // Center of tile
        });

        function createRoom() {
            const names = document.getElementById('player-names').value.split(',').map(n => n.trim());
            socket.emit('create_room', names);
        }

        function joinRoom(id) {
            const roomId = id || "1";
            socket.emit('join_room', roomId);
        }

        socket.on('room_created', (roomId) => {
            currentRoomId = roomId;
            enterGame();
        });

        socket.on('joined_room', (roomId) => {
            currentRoomId = roomId;
            enterGame();
        });

        socket.on('error', (msg) => alert(msg));

        function enterGame() {
            document.getElementById('setup-overlay').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            document.getElementById('room-id').textContent = currentRoomId;
        }

        socket.on('game_message', (msg) => {
            const messagesDiv = document.getElementById('messages');
            const p = document.createElement('p');
            p.textContent = msg;
            messagesDiv.appendChild(p);

            const numMatch = msg.match(/(?:Total|New total|rolled a|Roll|Rolled|be|is):?\s*(\d+)/i);
            if (numMatch) {
                const val = numMatch[1];
                animateNumbers(val);
            }
        });

        function animateNumbers(finalVal) {
            const el = document.getElementById('game-numbers');
            let count = 0;
            const emojis = ['🎲', '🎯', '🎰', '✨'];
            const interval = setInterval(() => {
                el.textContent = Math.floor(Math.random() * 6) + 1;
                el.style.transform = `scale(${1 + Math.random() * 0.5}) rotate(${Math.random() * 20 - 10}deg)`;
                count++;
                if (count > 12) {
                    clearInterval(interval);
                    el.textContent = finalVal;
                    el.style.transform = 'scale(1.2)';
                    setTimeout(() => el.style.transform = 'scale(1)', 200);
                }
            }, 60);
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        socket.on('game_state', (state) => {
            if (!state) return;

            // Update Stats
            const statsContainer = document.getElementById('stats-container');
            statsContainer.innerHTML = state.players.map((p, i) => `
                <div class="player-card ${i === state.currentPlayerIdx ? 'active' : ''}" style="border-left-color: ${colors[i % colors.length]}">
                    <h3>${escapeHTML(p.name)}</h3>
                    <p>💰 $${p.money.toLocaleString()}</p>
                    <p>📉 Debt: $${p.debt.toLocaleString()}</p>
                    <p>🎒 Items: ${escapeHTML(p.inventory.join(', ')) || 'None'}</p>
                </div>
            `).join('');

            // Update Tiles & Tokens
            tiles.forEach(t => t.classList.remove('active'));
            const activePlayer = state.players[state.currentPlayerIdx];
            document.getElementById(`tile-${activePlayer.position}`).classList.add('active');

            state.players.forEach((p, i) => {
                if (!playerTokens[p.name]) {
                    const token = document.createElement('div');
                    token.className = 'token';
                    token.style.background = colors[i % colors.length];
                    document.getElementById('board').appendChild(token);
                    playerTokens[p.name] = token;
                }

                const coords = tileCoords[p.position];
                // Offset tokens so they don't overlap perfectly
                const offset = (i - (state.players.length-1)/2) * 20;
                playerTokens[p.name].style.left = `${coords.x - 15 + offset}px`;
                playerTokens[p.name].style.top = `${coords.y - 15}px`;
            });
        });

        const actionPrompt = document.getElementById('action-prompt');
        const btnContainer = document.getElementById('btn-container');

        socket.on('need_roll', ({ prompt, usableItems }) => {
            resetInteraction();
            actionPrompt.textContent = prompt;

            const rollBtn = document.createElement('button');
            rollBtn.className = 'action-btn roll-btn';
            rollBtn.textContent = 'ROLL 🎲';
            rollBtn.onclick = () => {
                socket.emit('submit_input', { roomId: currentRoomId, val: 'roll' });
                resetInteraction();
            };
            btnContainer.appendChild(rollBtn);

            addItems(usableItems);
        });

        socket.on('need_choice', ({ prompt, choices, usableItems }) => {
            resetInteraction();
            actionPrompt.textContent = prompt;
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.textContent = choice;
                btn.onclick = () => { socket.emit('submit_input', { roomId: currentRoomId, val: choice }); resetInteraction(); };
                btnContainer.appendChild(btn);
            });
            addItems(usableItems);
        });

        function addItems(items) {
            if (!items) return;
            items.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'action-btn item-btn';
                btn.textContent = `Use ${item} 🎒`;
                btn.onclick = () => { socket.emit('submit_input', { roomId: currentRoomId, val: item }); resetInteraction(); };
                btnContainer.appendChild(btn);
            });
        }

        socket.on('need_input', (prompt) => {
            resetInteraction();
            actionPrompt.textContent = prompt;
            document.getElementById('manual-input').classList.remove('hidden');
        });

        document.getElementById('submit-btn').onclick = () => {
            socket.emit('submit_input', { roomId: currentRoomId, val: document.getElementById('user-input').value });
            document.getElementById('user-input').value = '';
            resetInteraction();
        };

        function resetInteraction() {
            actionPrompt.textContent = "Waiting...";
            btnContainer.innerHTML = '';
            document.getElementById('manual-input').classList.add('hidden');
        }

        socket.on('game_over', () => {
            resetInteraction();
            actionPrompt.textContent = "🎊 ESCAPED DEBT! 🎊";
            document.getElementById('game-numbers').textContent = "🏆";
        });
    </script>
</body>
</html>
